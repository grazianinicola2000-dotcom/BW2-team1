<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <title>Artist</title>
  </head>
  <body class="bg-dark text-white">
    <!-- INIZIO SEZIONE LOCANDINA -->
    <div class="container-fluid p-0 position-relative" style="overflow: hidden">
      <img src="./assets/imgs/main/image-10.jpg" class="img-fluid w-100" alt="Artist" />

      <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.8))"></div>

      <div class="position-absolute top-0 start-0 p-3">
        <button class="btn btn-dark rounded-circle opacity-75 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px">
          <i class="bi bi-arrow-left fs-3 fw-bold"></i>
        </button>
      </div>

      <div class="position-absolute bottom-0 start-0 w-100 p-4">
        <h1 class="display-3 fw-bold text-white mb-0">Pinguini Tattici Nucleari</h1>
        <p class="text-light opacity-75 small">3.961.093 ascoltatori mensili</p>
      </div>
    </div>
    <!-- FINE SEZIONE LOCANDINA -->
    <!-- INIZIO RIGA SEGUITI-->

    <div class="container-fluid px-4 py-3">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-light rounded-pill px-4 btn-sm">Seguiti</button>
        <a href="" class="text-secondary text-decoration-none">
          <i class="bi bi-three-dots text-secondary fs-3"></i>
        </a>
        <div class="ms-auto d-flex align-items-center gap-4">
          <a href="" class="text-success text-decoration-none">
            <i class="bi bi-shuffle text-success fs-3 fw-bold"></i>
          </a>
          <i class="bi bi-play-circle-fill text-success" style="font-size: 3.5rem"></i>
        </div>
      </div>
    </div>
    <!-- FINE RIGA SEGUITI-->
    <!-- INIZIO RIGA BRANI CHE TI PIACCIONO-->
    <div class="container-fluid px-4 mb-4">
      <div class="d-flex align-items-center gap-3 position-relative py-2">
        <div class="position-relative">
          <img src="./assets/imgs/main/image-10.jpg" class="rounded-circle object-fit-cover" style="width: 55px; height: 55px" alt="Artist" />

          <div
            class="position-absolute bottom-0 end-0 bg-success rounded-circle d-flex align-items-center justify-content-center border border-2 border-dark"
            style="width: 20px; height: 20px"
          >
            <i class="bi bi-heart-fill text-white" style="font-size: 0.6rem"></i>
          </div>
        </div>
        <div>
          <h6 class="mb-0 text-white fw-bold">Brani che ti piacciono</h6>
          <small class="text-secondary">8 brani di Pinguini Tattici Nucleari</small>
        </div>
      </div>
    </div>
    <!-- FINE RIGA BRANI CHE TI PIACCIONO-->
    <!-- INIZIO BRANI POPOLARI-->

    <div class="container-fluid px-4 mb-5">
      <h4 class="mb-4">Popolari</h4>

      <div class="row align-items-center mb-3 g-0">
        <div class="col-auto text-secondary small pe-3">1</div>

        <div class="col d-flex align-items-center">
          <a href="" class="d-flex align-items-center text-decoration-none text-white w-100">
            <div class="me-3">
              <img src="./assets/imgs/main/image-10.jpg" class="object-fit-cover" style="width: 45px; height: 45px" alt="Ricordi" />
            </div>
            <div>
              <div class="fw-bold lh-1">Ricordi</div>
              <div class="small text-secondary">10.333.333</div>
            </div>
          </a>
        </div>

        <div class="col-auto">
          <a href="" class="text-secondary text-decoration-none">
            <i class="bi bi-three-dots-vertical"></i>
          </a>
        </div>
      </div>

      <div class="row align-items-center mb-3 g-0">
        <div class="col-auto text-secondary small pe-3">2</div>

        <div class="col d-flex align-items-center">
          <a href="" class="d-flex align-items-center text-decoration-none text-white w-100">
            <div class="me-3">
              <img src="./assets/imgs/main/image-10.jpg" class="object-fit-cover" style="width: 45px; height: 45px" alt="Giovani Wannabe" />
            </div>
            <div>
              <div class="fw-bold lh-1">Giovani Wannabe</div>
              <div class="small text-secondary">47.456.224</div>
            </div>
          </a>
        </div>

        <div class="col-auto">
          <a href="" class="text-secondary text-decoration-none">
            <i class="bi bi-three-dots-vertical"></i>
          </a>
        </div>
      </div>

      <div class="row align-items-center mb-3 g-0">
        <div class="col-auto text-secondary small pe-3">3</div>

        <div class="col d-flex align-items-center">
          <a href="" class="d-flex align-items-center text-decoration-none text-white w-100">
            <div class="me-3">
              <img src="./assets/imgs/main/image-10.jpg" class="object-fit-cover" style="width: 45px; height: 45px" alt="Pastello Bianco" />
            </div>
            <div>
              <div class="fw-bold lh-1">Pastello Bianco</div>
              <div class="small text-secondary">34.343.231</div>
            </div>
          </a>
        </div>

        <div class="col-auto">
          <a href="" class="text-secondary text-decoration-none">
            <i class="bi bi-three-dots-vertical"></i>
          </a>
        </div>
      </div>
    </div>
    <!-- FINE BRANI POPOLARI-->
    <div class="fixed-bottom bg-black p-2 mx-2 mb-2">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3 overflow-hidden">
          <img src="./assets/imgs/main/image-10.jpg" class="rounded" style="width: 40px; height: 40px; object-fit: cover" alt="Current Song" />

          <a href=" " class="text-decoration-none text-white text-truncate">
            <div class="text-truncate small fw-bold">Supernatural Parody</div>
            <div class="text-secondary small" style="font-size: 0.7rem">The Hillwood...</div>
          </a>
        </div>

        <div class="d-flex gap-3 align-items-center ps-2">
          <i class="bi bi-pc-display text-secondary"></i>
          <i class="bi bi-heart text-white"></i>
          <i class="bi bi-play-fill text-white fs-3"></i>
        </div>
      </div>
    </div>
  </body>
</html>
